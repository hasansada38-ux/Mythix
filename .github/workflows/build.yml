
name: Build Mythix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Compile Mythix
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64

      - name: Upload Geode file
        uses: actions/upload-artifact@v4
        with:
          name: Mythix-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
