name: Build Mythix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Mythix for Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload the .geode package
        uses: actions/upload-artifact@v4
        with:
          name: Mythix-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

  build-android:
    name: Build Mythix for Android (64-bit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release

      - name: Upload the Android .geode package
        uses: actions/upload-artifact@v4
        with:
          name: Mythix-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
