name: Build Mythix

on:
  push:
    branches:
      - main
      - feature/autonomous-bot-bloodbath
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Mythix for Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Verify packaged mod icon
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: python .github/scripts/verify_geode_logo.py "$env:BUILD_OUTPUT"

      - name: Publish standalone Windows .geode
        shell: pwsh
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          $built = Get-ChildItem -LiteralPath $env:BUILD_OUTPUT -Filter '*.geode' -File -Recurse | Select-Object -First 1
          if (-not $built) { throw "No .geode package found under $env:BUILD_OUTPUT" }
          $package = Join-Path $env:RUNNER_TEMP 'Mythix-Windows.geode'
          Copy-Item -LiteralPath $built.FullName -Destination $package -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan geode-windows
          git rm -rf .
          Copy-Item -LiteralPath $package -Destination 'Mythix-Windows.geode'
          git add 'Mythix-Windows.geode'
          git commit -m 'Publish standalone Windows Geode package'
          git push origin HEAD:geode-windows --force

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Mythix-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

  build-android:
    name: Build Mythix for Android (64-bit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release

      - name: Verify packaged mod icon
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: python3 .github/scripts/verify_geode_logo.py "$BUILD_OUTPUT"

      - name: Publish standalone Android64 .geode
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          package_path="$(find "$BUILD_OUTPUT" -type f -name '*.geode' -print -quit)"
          test -n "$package_path" || { echo "No .geode package found under $BUILD_OUTPUT"; exit 1; }
          cp "$package_path" "$RUNNER_TEMP/Mythix-Android64.geode"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan geode-android64
          cp "$RUNNER_TEMP/Mythix-Android64.geode" ./Mythix-Android64.geode
          git add Mythix-Android64.geode
          git commit -m 'Publish standalone Android64 Geode package'
          git push origin HEAD:geode-android64 --force

      - name: Upload the Android build
        uses: actions/upload-artifact@v4
        with:
          name: Mythix-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
